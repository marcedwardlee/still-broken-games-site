name: Materialize rider image

on:
  push:
    branches:
      - fix/direct-rider-jpeg
    paths:
      - assets/goat-knight-rider.svg
      - .github/workflows/materialize-rider-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-rider-jpeg
      - name: Decode embedded WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          src = Path('assets/goat-knight-rider.svg').read_text()
          match = re.search(r'href="data:image/webp;base64,([^"]+)"', src)
          if not match:
              raise SystemExit('embedded WebP data URI not found')
          Path('assets/goat-knight-rider.webp').write_bytes(base64.b64decode(match.group(1)))
          PY
      - name: Commit standalone image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/goat-knight-rider.webp
          if git diff --cached --quiet; then
            echo "No image change to commit"
            exit 0
          fi
          git commit -m "build: add standalone GOAT Knight rider image"
          git push origin HEAD:fix/direct-rider-jpeg
