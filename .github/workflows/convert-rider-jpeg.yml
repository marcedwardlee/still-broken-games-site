name: Convert rider artwork to JPEG

on:
  push:
    branches:
      - fix/jpeg-rider-compat
    paths:
      - .github/workflows/convert-rider-jpeg.yml
      - assets/goat-knight-rider.webp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jpeg-rider-compat
      - name: Convert WebP to baseline JPEG
        run: |
          set -euo pipefail
          ffmpeg -y -i assets/goat-knight-rider.webp -pix_fmt yuvj420p -q:v 2 assets/goat-knight-rider.jpg
          file assets/goat-knight-rider.jpg
      - name: Commit JPEG
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/goat-knight-rider.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: add JPEG rider artwork"
          git push origin HEAD:fix/jpeg-rider-compat
